name: tests

# No secrets are configured on purpose: both suites run with no API key, so a
# CI run is free and cannot spend money even if a key is added to the repo later
# (the browser server calls llm.go_offline()).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Unit and pipeline tests
        working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install UI dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
